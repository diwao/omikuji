version: 2

# GitHub reads this configuration from the default branch (main).
# Version update PRs target dev; security update PRs use the default branch.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#target-branch
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
